name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the P-ASES package
        run: python -m pip install -e .
      - name: Compile runtime, tools, and tests
        run: python -m compileall runtime tools tests
      - name: Check committed distributions before mutation
        run: python tools/build_dist.py --check
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate repository documentation
        run: python -m p_ases docs validate --root .
      - name: Check repository documentation formatting
        run: python -m p_ases docs format --check --root .
      - name: Validate P-ASES specification traceability
        run: |
          python tools/validate_pases_traceability.py specification
          python tools/validate_pases_traceability.py design
          python tools/validate_pases_traceability.py test-oracle
      - name: Generate distributions
        run: python tools/build_dist.py
      - name: Check generated distributions
        run: python tools/build_dist.py --check
      - name: Validate distributions
        run: python tools/validate_dist.py
      - name: Validate the exact 16-Skill package
        run: python tools/validate_parent_acceptance.py 16-skills-package
      - name: Confirm generated paths remain unchanged
        run: git diff --exit-code -- dist .agents/plugins/marketplace.json .claude-plugin/marketplace.json
      - name: Check committed diff whitespace
        run: git diff --check HEAD^1 HEAD

  pull-request-metadata:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Read current pull request metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) throw new Error('pull_request payload is missing');
            core.info(`PR #${pr.number}: ${pr.state}; draft=${pr.draft}; head=${pr.head.sha}`);
