name: Parent Integration Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parent-acceptance:
    name: parent-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Specification traceability
        run: python tools/validate_parent_acceptance.py specification
      - name: Design traceability
        run: python tools/validate_parent_acceptance.py design
      - name: Test-oracle traceability
        run: python tools/validate_parent_acceptance.py test-oracle
      - name: Check canonical 16-Skill package
        run: python tools/validate_parent_acceptance.py 16-skills-package
      - name: Check generated distributions
        run: python tools/build_dist.py --check
      - name: Validate distributions
        run: python tools/validate_dist.py
