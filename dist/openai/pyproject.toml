[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow"
dynamic = ["version"]
description = "Portable Issue-first workflow tools for AI coding agents"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "runtime"}

[tool.setuptools.dynamic]
version = {attr = "agent_workflow.__version__"}

[tool.setuptools.packages.find]
where = ["runtime"]
