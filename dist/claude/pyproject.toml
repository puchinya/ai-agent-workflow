[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p-ases"
dynamic = ["version"]
description = "Puchinya Agentic Software Engineering System workflow runtime and tools"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "runtime"}

[tool.setuptools.dynamic]
version = {attr = "p_ases.__version__"}

[tool.setuptools.packages.find]
where = ["runtime"]
include = ["p_ases*"]
